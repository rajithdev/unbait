<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Unbait</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1d2226; --muted: #5e6670; --line: #e3e2df; --soft: #f4f2ee;
    --accent: #0a66c2; --accent-ink: #ffffff; --warn: #915907;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1f23; --ink: #e9e9e9; --muted: #a7acb1; --line: #38434f; --soft: #24292e; --accent: #71b7fb; --accent-ink: #0b1620; --warn: #e7a33e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 28px; height: 28px; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; }
  h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; }
  label.row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; cursor: pointer; }
  label.row input { margin: 2px 0 0; accent-color: var(--accent); }
  label.row small { display: block; color: var(--muted); }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .status.warn { color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); }
  input[type=url] { width: 100%; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  footer { padding: 10px 16px 14px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }
  a { color: var(--accent); }
  .off main { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<header>
  <img src="icons/48.png" alt="" />
  <h1>Unbait</h1>
  <label class="switch" title="Turn Unbait on or off"><input type="checkbox" id="enabled" aria-label="Unbait on" /><span></span></label>
</header>
<main>
  <section aria-labelledby="stats-h">
    <h2 id="stats-h">Posts hidden</h2>
    <div class="stats">
      <div class="stat"><b id="today">0</b><span>today</span></div>
      <div class="stat"><b id="total">0</b><span>all time</span></div>
      <div class="stat"><b id="checked">0</b><span>checked</span></div>
    </div>
  </section>
  <section aria-labelledby="cats-h">
    <h2 id="cats-h">Hide</h2>
    <div id="categories"></div>
  </section>
  <section aria-labelledby="mode-h">
    <h2 id="mode-h">How posts are checked</h2>
    <label class="row"><input type="radio" name="mode" value="rules" />
      <span>Rules only<small>Catches the obvious ones. Nothing leaves your browser.</small></span></label>
    <label class="row"><input type="radio" name="mode" value="ai" />
      <span>Rules + AI<small>Posts the rules can't decide are sent to the Unbait server as text only, without names.</small></span></label>
    <div id="status" class="status" role="status"></div>
    <details id="advanced">
      <summary>Server</summary>
      <input type="url" id="apiUrl" placeholder="https://unbait.example.com" spellcheck="false" />
    </details>
  </section>
</main>
<footer><span>Hidden posts stay one click away.</span><a href="https://github.com/rajithdev/unbait" target="_blank" rel="noopener">Source</a></footer>
<script src="popup.js" type="module"></script>
</body>
</html>
